# ez-appsec scanning ez-appsec — dogfooding.
#
# Installs ez-appsec from source (no pre-built image needed) so every
# change to the scanner is immediately tested against the codebase itself.
# External scanners are installed directly on the runner.
#
# Results are uploaded to the GitHub Security tab (SARIF) and posted as a
# PR comment. On pushes to main, results are also pushed to the dashboard.

name: ez-appsec Self-Scan

on:
  push:
    branches:
      - main
      - '**'   # remove after merging to main; kept so CI runs during the PR phase
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # SARIF upload to Security tab
  pull-requests: write     # PR comments
  actions: read

env:
  OUTPUT_DIR: scan-results
  SARIF_FILE: scan-results/ez-appsec.sarif
  VULNS_FILE: scan-results/vulnerabilities.json

jobs:
  scan:
    name: Self-Scan
    runs-on: ubuntu-latest
    outputs:
      findings-count: ${{ steps.count.outputs.findings-count }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # -----------------------------------------------------------------------
      # Install ez-appsec from source
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ez-appsec
        run: pip install -e .

      # -----------------------------------------------------------------------
      # Install external scanners
      # -----------------------------------------------------------------------
      - name: Install gitleaks
        run: |
          VERSION="v8.30.1"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Install semgrep
        run: |
          pip install semgrep
          semgrep --version

      - name: Install grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin v0.110.0
          grype version

      - name: Scanner status
        run: ez-appsec status

      # -----------------------------------------------------------------------
      # Run scan
      # -----------------------------------------------------------------------
      - name: Run ez-appsec scan (SARIF)
        id: scan
        run: |
          mkdir -p "${OUTPUT_DIR}"
          SEVERITY="${{ github.event_name == 'pull_request' && 'all' || 'medium' }}"
          echo "Severity: $SEVERITY"
          ez-appsec github-scan . --output "${SARIF_FILE}" --severity "$SEVERITY"
          ls -lh "${SARIF_FILE}"

      - name: Count findings
        id: count
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          data = json.load(open(os.environ['SARIF_FILE']))
          results = data.get('runs', [{}])[0].get('results', [])
          print(f"findings-count={len(results)}")
          PY
          echo "Findings: $(awk -F= '/^findings-count=/{print $2}' "$GITHUB_OUTPUT")"

      - name: Summarize vulnerabilities (severity + trend)
        id: summarize
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from collections import Counter
          path = os.environ['VULNS_FILE']
          try:
              data = json.load(open(path))
          except (FileNotFoundError, json.JSONDecodeError):
              print("summary-json={}")
              raise SystemExit(0)
          vulns = data.get('vulnerabilities', []) if isinstance(data, dict) else data
          sev = Counter((v.get('severity') or 'unknown').lower() for v in vulns)
          trends = Counter((v.get('trend') or 'unchanged').lower() for v in vulns)
          summary = {
              'total': len(vulns),
              'critical': sev.get('critical', 0),
              'high': sev.get('high', 0),
              'medium': sev.get('medium', 0),
              'low': sev.get('low', 0),
              'info': sev.get('info', 0),
              'new': trends.get('new', 0),
              'unchanged': trends.get('unchanged', 0),
              'resolved': trends.get('resolved', 0),
          }
          import json as _j
          print(f"summary-json={_j.dumps(summary)}")
          PY
        env:
          VULNS_FILE: ${{ env.OUTPUT_DIR }}/vulnerabilities.json

      - name: Generate vulnerabilities.json
        id: web-report
        run: ez-appsec web-report . --output "${OUTPUT_DIR}"
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Upload results
      # -----------------------------------------------------------------------
      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ env.SARIF_FILE }}
        continue-on-error: true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ez-appsec-self-scan-${{ github.sha }}
          path: ${{ env.OUTPUT_DIR }}/
          retention-days: 30
          if-no-files-found: warn

      # -----------------------------------------------------------------------
      # Push to dashboard (main branch only)
      # -----------------------------------------------------------------------
      - name: Check dashboard app credentials
        id: dashboard-creds
        if: steps.web-report.outcome == 'success' && github.event_name != 'pull_request' && vars.EZ_APPSEC_DASHBOARD_REPO != ''
        env:
          EZ_APPSEC_APP_ID: ${{ secrets.EZ_APPSEC_APP_ID }}
          EZ_APPSEC_PRIVATE_KEY: ${{ secrets.EZ_APPSEC_PRIVATE_KEY }}
        run: |
          if [ -n "${EZ_APPSEC_APP_ID}" ] && [ -n "${EZ_APPSEC_PRIVATE_KEY}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Dashboard app credentials are not configured — skipping dashboard token mint."
          fi

      - name: Mint App token for dashboard push
        id: dash-token
        if: steps.dashboard-creds.outputs.enabled == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.EZ_APPSEC_APP_ID }}
          private-key: ${{ secrets.EZ_APPSEC_PRIVATE_KEY }}
          owner: ez-appsec
          repositories: ez-appsec-dashboard

      - name: Push to dashboard
        if: steps.web-report.outcome == 'success' && github.event_name != 'pull_request'
        env:
          _PUSH_TOKEN: ${{ steps.dash-token.outputs.token }}
          EZ_APPSEC_DASHBOARD_REPO: ${{ vars.EZ_APPSEC_DASHBOARD_REPO || 'ez-appsec/ez-appsec-dashboard' }}
        run: |
          if [ -z "${_PUSH_TOKEN}" ]; then
            echo "No push token available — skipping dashboard update."
            exit 0
          fi
          if [ ! -f "${VULNS_FILE}" ]; then
            echo "vulnerabilities.json not found — skipping."
            exit 0
          fi
          SLUG=$(echo "${{ github.repository }}" | tr '/._[:upper:]' '---_[:lower:]')
          DASH_DIR=$(mktemp -d)
          git clone "https://x-access-token:${_PUSH_TOKEN}@github.com/${EZ_APPSEC_DASHBOARD_REPO}.git" \
            "${DASH_DIR}/dashboard"
          mkdir -p "${DASH_DIR}/dashboard/data/projects/${SLUG}"
          cp "${VULNS_FILE}" "${DASH_DIR}/dashboard/data/projects/${SLUG}/vulnerabilities.json"
          cat > "${DASH_DIR}/dashboard/data/projects/${SLUG}/meta.json" << METAEOF
          {
            "project_name": "${{ github.event.repository.name }}",
            "project_path": "${{ github.repository }}",
            "github_url": "https://github.com/${{ github.repository }}",
            "default_branch": "${{ github.event.repository.default_branch }}",
            "last_updated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          METAEOF
          cd "${DASH_DIR}/dashboard"
          git config user.name "ez-appsec scan"
          git config user.email "ci@ez-appsec.ai"
          git add data/projects/
          git diff --staged --quiet && echo "No changes." || \
            git commit -m "chore: update scan results for ${{ github.repository }}"
          git push origin main
          rm -rf "${DASH_DIR}"

      # -----------------------------------------------------------------------
      # PR comment
      # -----------------------------------------------------------------------
      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.scan.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';

            // v2 summary: severity breakdown + new/resolved trend from vulnerabilities.json
            let summary = null;
            const raw = '${{ steps.summarize.outputs.summary-json }}';
            if (raw) {
              try { summary = JSON.parse(raw); } catch (e) { summary = null; }
            }

            const SEV_META = {
              critical: { icon: '🔴', label: 'Critical' },
              high:     { icon: '🟠', label: 'High' },
              medium:   { icon: '🟡', label: 'Medium' },
              low:      { icon: '🔵', label: 'Low' },
              info:     { icon: '⚪', label: 'Info' },
            };

            let body = `## 🔒 ez-appsec Self-Scan Results\n\n`;
            body += `| Scanner | Status |\n|---------|--------|\n`;
            body += `| gitleaks | ✓ secrets detection |\n`;
            body += `| semgrep  | ✓ SAST |\n`;
            body += `| grype    | ✓ dependency CVEs |\n\n`;

            if (summary) {
              const total = summary.total || 0;
              const rows = ['critical', 'high', 'medium', 'low', 'info']
                .map(s => {
                  const meta = SEV_META[s];
                  const c = summary[s] || 0;
                  return c > 0 ? `| ${meta.icon} ${meta.label} | ${c} |` : null;
                })
                .filter(Boolean)
                .join('\n');
              if (rows) {
                body += `| Severity | Count |\n|----------|-------|\n${rows}\n\n`;
              } else {
                body += `**Total findings:** ${total}\n\n`;
              }
              const trendParts = [];
              if (summary.new) trendParts.push(`**${summary.new} new**`);
              if (summary.resolved) trendParts.push(`**${summary.resolved} resolved**`);
              if (trendParts.length) {
                body += `${trendParts.join(' · ')} since last scan\n\n`;
              } else if (total === 0) {
                body += `✅ No findings\n\n`;
              }
            } else {
              const count = '${{ steps.count.outputs.findings-count }}';
              body += `**Total findings:** ${count}\n\n`;
            }

            body += `📊 [View full results and artifacts](${runUrl})\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('ez-appsec Self-Scan Results')
            );
            const payload = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            };
            if (existing) {
              await github.rest.issues.updateComment({ ...payload, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...payload, issue_number: context.issue.number });
            }

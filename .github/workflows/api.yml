name: API Build and Publish

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'Dockerfile.api'
      - '.github/workflows/api.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'Dockerfile.api'
      - '.github/workflows/api.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-api

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r api/requirements.txt -r requirements.txt
          pip install --no-cache-dir -e .
          pip install --no-cache-dir pytest httpx

      - name: Run API tests
        run: pytest tests/test_api.py -v

  build:
    name: Build and Push API Image
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # Smoke-test the image so entrypoint/health regressions are caught before
      # a tag is pushed to GHCR (review #26). Runs on PRs and main pushes.
      - name: Smoke test built image
        run: |
          docker build -f Dockerfile.api -t ez-appsec-api:smoke .
          docker run --rm -d --name api-smoke -p 8000:8000 \
            -e EZ_APPSEC_API_KEY=smoke-key ez-appsec-api:smoke
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "health check passed"
              docker stop api-smoke
              exit 0
            fi
            sleep 1
          done
          echo "::error::API container did not become healthy"
          docker logs api-smoke || true
          docker stop api-smoke || true
          exit 1
